name: Sync Cypwn Repo (Safe)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cypwn Raw
        run: |
          curl -L \
            -H "User-Agent: AppleJrBot/1.0" \
            -H "Accept: application/json" \
            https://ipa.cypwn.xyz/cypwn.json \
            -o raw.txt

          echo "---- RAW HEAD ----"
          head -n 5 raw.txt

      - name: Normalize JSON (Safe)
        run: |
          # ambil JSON pertama yang valid
          sed -n '/{/,/}/p' raw.txt > extracted.json || true

          # validasi json
          if jq empty extracted.json >/dev/null 2>&1; then
            jq '
              if .apps then {apps:.apps}
              elif .repoApps then {apps:.repoApps}
              else .
              end
            ' extracted.json > cypwn.json
          else
            echo '{"apps":[]}' > cypwn.json
          fi

          rm -f raw.txt extracted.json

      - name: Commit if Changed
        run: |
          git config user.name "AppleJr Bot"
          git config user.email "bot@applejr.net"

          git add cypwn.json
          git diff --cached --quiet && echo "No changes" || \
          git commit -m "🔄 Auto sync Cypwn repo" && git push
