name: Sync Cypwn Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # update tiap 6 jam

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Cypwn JSON (OFFICIAL)
        run: |
          curl -L https://raw.githubusercontent.com/cypwn/cypwn-repo/main/cypwn.json -o cypwn.json

      - name: Validate JSON
        run: |
          jq . cypwn.json > /dev/null

      - name: Commit & Push
        run: |
          git config user.name "AppleJr Bot"
          git config user.email "bot@applejr.net"
          git add cypwn.json
          git commit -m "🔄 Auto sync Cypwn repo" || echo "No changes"
          git push
