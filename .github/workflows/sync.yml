name: Sync Cypwn Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch raw cypwn
        run: |
          curl -L https://raw.githubusercontent.com/cypwn/cypwn-repo/main/cypwn.json -o raw.txt

      - name: Convert to valid JSON
        run: |
          sed -n '/{/,/}/p' raw.txt > cypwn.json

      - name: Validate JSON
        run: |
          jq . cypwn.json > /dev/null

      - name: Commit & Push
        run: |
          git config user.name "AppleJr Bot"
          git config user.email "bot@applejr.net"
          git add cypwn.json
          git commit -m "🔄 Auto sync Cypwn repo" || echo "No changes"
          git push
